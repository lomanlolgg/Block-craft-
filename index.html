<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blockcraft UI</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--u:3;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:#000;overflow:hidden;font-family:'Press Start 2P',ui-monospace,Menlo,monospace;color:#fff;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen.on{display:flex}
.shade{background:rgba(0,0,0,.55)}
#title{background-size:calc(32px*var(--u));image-rendering:pixelated}
.btn{width:calc(100px*var(--u));height:calc(20px*var(--u));margin:calc(2px*var(--u)) 0;font:inherit;font-size:calc(5px*var(--u));color:#e8e8e8;background:#707070;border:calc(1px*var(--u)) solid;border-color:#b0b0b0 #262626 #262626 #b0b0b0;box-shadow:inset calc(-1px*var(--u)) calc(-1px*var(--u)) #4d4d4d;text-shadow:calc(.6px*var(--u)) calc(.6px*var(--u)) #2a2a2a;cursor:pointer;padding:0}
.btn:hover:not(:disabled){background:#6573b4;color:#ffffa0}
.btn:disabled{color:#9a9a9a;background:#555;cursor:default}
.logo{position:relative;font-size:calc(11px*var(--u));color:#c4c4c4;margin-bottom:calc(14px*var(--u));letter-spacing:calc(-1px*var(--u));text-shadow:calc(1px*var(--u)) calc(1px*var(--u)) #6a6a6a,calc(2px*var(--u)) calc(2px*var(--u)) #4e4e4e,calc(3px*var(--u)) calc(3px*var(--u)) #333,calc(4px*var(--u)) calc(4px*var(--u)) #222}
.splash{position:absolute;right:calc(-10px*var(--u));bottom:calc(-9px*var(--u));font-size:calc(4.5px*var(--u));color:#ff0;text-shadow:calc(.6px*var(--u)) calc(.6px*var(--u)) #3f3f00;letter-spacing:0;white-space:nowrap;transform:rotate(-20deg);animation:pu .6s ease-in-out infinite alternate}
@keyframes pu{to{transform:rotate(-20deg) scale(1.1)}}
.foot{position:absolute;left:calc(3px*var(--u));right:calc(3px*var(--u));bottom:calc(3px*var(--u) + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;font-size:calc(3.5px*var(--u));text-shadow:calc(.5px*var(--u)) calc(.5px*var(--u)) #222}
.gap{height:calc(8px*var(--u))}
.cross{position:absolute;left:50%;top:50%;width:calc(9px*var(--u));height:calc(9px*var(--u));transform:translate(-50%,-50%);mix-blend-mode:difference;pointer-events:none}
.cross::before,.cross::after{content:'';position:absolute;background:#fff}
.cross::before{left:0;right:0;top:calc(4px*var(--u));height:calc(1px*var(--u))}
.cross::after{top:0;bottom:0;left:calc(4px*var(--u));width:calc(1px*var(--u))}
.hud{position:absolute;left:0;right:0;bottom:calc(2px*var(--u) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center}
.toast{height:calc(8px*var(--u));font-size:calc(4.5px*var(--u));text-shadow:calc(.6px*var(--u)) calc(.6px*var(--u)) #222;margin-bottom:calc(2px*var(--u));transition:opacity .6s;opacity:0}
.bars{width:calc(182px*var(--u));display:flex;justify-content:space-between;margin-bottom:calc(1px*var(--u))}
.row{display:flex;gap:calc(0px*var(--u))}
.sp{width:calc(8px*var(--u));height:calc(9px*var(--u));image-rendering:pixelated;margin-right:calc(0px*var(--u))}
.food{flex-direction:row-reverse}
.xp{position:relative;width:calc(182px*var(--u));height:calc(5px*var(--u));background:#2a2a2a;border:calc(.5px*var(--u)) solid #000;box-sizing:border-box;margin:calc(2px*var(--u)) 0 calc(2px*var(--u))}
.xp i{display:block;height:100%;width:42%;background:#7be03a}
.lvl{font-size:calc(5px*var(--u));color:#80ff20;text-shadow:calc(.6px*var(--u)) 0 #000,calc(-.6px*var(--u)) 0 #000,0 calc(.6px*var(--u)) #000,0 calc(-.6px*var(--u)) #000;margin-bottom:calc(-3px*var(--u));position:relative;z-index:1;margin-top:calc(-1px*var(--u))}
.hotbar{display:flex;background:rgba(40,40,40,.55);border:calc(1px*var(--u)) solid #111;box-sizing:border-box}
.slot{width:calc(20px*var(--u));height:calc(20px*var(--u));box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hotbar .slot{border-right:calc(1px*var(--u)) solid rgba(0,0,0,.5)}
.slot img{width:calc(16px*var(--u));height:calc(16px*var(--u));image-rendering:pixelated;pointer-events:none}
.slot b{position:absolute;right:calc(1px*var(--u));bottom:0;font-weight:400;font-size:calc(4px*var(--u));text-shadow:calc(.6px*var(--u)) calc(.6px*var(--u)) #3f3f3f;pointer-events:none}
.slot.sel::after{content:'';position:absolute;inset:calc(-1px*var(--u));border:calc(1.5px*var(--u)) solid #fff;box-shadow:0 0 0 calc(.5px*var(--u)) #000;pointer-events:none;z-index:2}
.panel{background:#c6c6c6;border:calc(1.5px*var(--u)) solid;border-color:#fff #555 #555 #fff;box-shadow:0 0 0 calc(1px*var(--u)) #000;padding:calc(5px*var(--u));color:#404040;font-size:calc(4.5px*var(--u))}
.panel h2{font-size:calc(4.5px*var(--u));font-weight:400;margin:calc(1px*var(--u)) 0 calc(3px*var(--u))}
.grid{display:grid;grid-template-columns:repeat(9,calc(20px*var(--u)));margin-bottom:calc(4px*var(--u))}
.panel .slot{background:#8b8b8b;border:calc(1px*var(--u)) solid;border-color:#373737 #fff #fff #373737}
.panel .slot:hover{background:#b4b4b4}
.panel .slot b{color:#fff}
.hint{margin-top:calc(4px*var(--u));font-size:calc(3.5px*var(--u));color:#ddd;text-shadow:calc(.5px*var(--u)) calc(.5px*var(--u)) #222}
.cap{font-size:calc(5px*var(--u));margin-bottom:calc(8px*var(--u));text-shadow:calc(.6px*var(--u)) calc(.6px*var(--u)) #222}
#tc{display:none}body.touch #tc{display:block}body.touch #game{touch-action:none;-webkit-touch-callout:none}
#js{position:absolute;left:calc(6px*var(--u));bottom:calc(56px*var(--u) + env(safe-area-inset-bottom,0px));width:calc(36px*var(--u));height:calc(36px*var(--u));border-radius:50%;background:rgba(0,0,0,.28);border:calc(1px*var(--u)) solid rgba(255,255,255,.5);box-sizing:border-box;touch-action:none}
#js i{position:absolute;left:50%;top:50%;width:calc(16px*var(--u));height:calc(16px*var(--u));margin:calc(-8px*var(--u)) 0 0 calc(-8px*var(--u));border-radius:50%;background:rgba(255,255,255,.55)}
#jb{position:absolute;right:calc(8px*var(--u));bottom:calc(60px*var(--u) + env(safe-area-inset-bottom,0px));width:calc(24px*var(--u));height:calc(24px*var(--u));border-radius:50%;background:rgba(0,0,0,.28);border:calc(1px*var(--u)) solid rgba(255,255,255,.5);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:calc(4px*var(--u));touch-action:none}
#jb:active{background:rgba(255,255,255,.35)}
.tb{position:absolute;top:calc(3px*var(--u) + env(safe-area-inset-top,0px));height:calc(12px*var(--u));padding:0 calc(3px*var(--u));font:inherit;font-size:calc(4px*var(--u));color:#fff;background:#707070;border:calc(1px*var(--u)) solid;border-color:#b0b0b0 #262626 #262626 #b0b0b0}
#tp{right:calc(3px*var(--u))}#ti{right:calc(20px*var(--u))}
.dirt{background-image:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),var(--dirt);background-size:auto,calc(32px*var(--u));image-rendering:pixelated}
.inp{font:inherit;font-size:calc(4.5px*var(--u));width:calc(100px*var(--u));height:calc(14px*var(--u));box-sizing:border-box;margin:calc(1px*var(--u)) 0 calc(4px*var(--u));padding:0 calc(3px*var(--u));background:#000;color:#fff;border:calc(1px*var(--u)) solid #a0a0a0;outline:none;user-select:text;-webkit-user-select:text;border-radius:0}
.inp:focus{border-color:#fff}
.lbl{width:calc(100px*var(--u));font-size:calc(3.6px*var(--u));color:#bbb;text-align:left}
.wl{width:calc(150px*var(--u));max-width:92%;max-height:40%;overflow:auto;background:rgba(0,0,0,.55);border:calc(1px*var(--u)) solid #333;padding:calc(2px*var(--u));margin-bottom:calc(5px*var(--u));box-sizing:border-box}
.wi{display:flex;align-items:center;justify-content:space-between;padding:calc(3px*var(--u));border:calc(1px*var(--u)) solid transparent;cursor:pointer;font-size:calc(4.2px*var(--u))}
.wi:hover{border-color:#aaa;background:rgba(255,255,255,.08)}
.wi small{display:block;font-size:calc(3px*var(--u));color:#999;margin-top:calc(1.5px*var(--u))}
.wi button{font:inherit;font-size:calc(3.2px*var(--u));background:#703030;color:#fff;border:calc(1px*var(--u)) solid #200;cursor:pointer;padding:calc(2px*var(--u))}
body.creative .bars,body.creative .xp,body.creative .lvl{display:none}
#dn{display:none;position:absolute;right:calc(11px*var(--u));bottom:calc(88px*var(--u) + env(safe-area-inset-bottom,0px));width:calc(18px*var(--u));height:calc(18px*var(--u));border-radius:50%;background:rgba(0,0,0,.28);border:calc(1px*var(--u)) solid rgba(255,255,255,.5);box-sizing:border-box;align-items:center;justify-content:center;font-size:calc(4px*var(--u));touch-action:none}
body.flying #dn{display:flex}
</style></head>
<body>
<canvas id="scene"></canvas>

<div id="title" class="screen on">
  <div class="logo">BLOCKCRAFT<div class="splash" id="splash"></div></div>
  <button class="btn" id="sp">Singleplayer</button>
  <button class="btn" disabled>Multiplayer</button>
  <button class="btn" disabled>Texture Packs</button>
  <div class="gap"></div>
  <button class="btn" id="o1">Options...</button>
  <button class="btn" id="q">Quit Game</button>
  <div class="foot"><span>Blockcraft UI 1.0</span><span>Original fan homage</span></div>
</div>

<div id="game" class="screen">
  <div class="cross" id="cross"></div>
  <div class="hud">
    <div class="toast" id="toast"></div>
    <div class="bars"><div class="row" id="hearts"></div><div class="row food" id="food"></div></div>
    <div class="lvl">7</div>
    <div class="xp"><i></i></div>
    <div class="hotbar" id="hot"></div>
  </div>
</div>

<div id="worlds" class="screen dirt">
  <div class="cap">Select World</div>
  <div class="wl" id="wl"></div>
  <button class="btn" id="wnew">Create New World</button>
  <button class="btn" id="wback">Back</button>
</div>

<div id="create" class="screen dirt">
  <div class="cap">Create New World</div>
  <div class="lbl">World Name</div><input class="inp" id="wname" maxlength="24" value="New World" autocomplete="off">
  <div class="lbl">Seed (leave blank for random)</div><input class="inp" id="wseed" maxlength="24" placeholder="Random" autocomplete="off">
  <button class="btn" id="wmode"></button>
  <button class="btn" id="wgo">Create New World</button>
  <button class="btn" id="wcancel">Cancel</button>
</div>

<div id="inv" class="screen shade">
  <div class="panel">
    <h2>Inventory</h2>
    <div id="cr"></div>
    <div class="grid" id="ig"></div>
    <div class="grid" id="ih" style="margin-bottom:0"></div>
  </div>
  <div class="hint">Tap a block to put it in the selected slot.</div>
  <button class="btn" id="ic" style="margin-top:calc(4px*var(--u))">Done</button>
</div>

<div id="pause" class="screen shade">
  <div class="cap">Game menu</div>
  <button class="btn" id="bk">Back to Game</button>
  <div class="gap"></div>
  <button class="btn" id="o2">Options...</button>
  <button class="btn" id="st">Save and Quit to Title</button>
</div>

<div id="opts" class="screen shade">
  <div class="cap">Options</div>
  <button class="btn" id="omode"></button>
  <button class="btn" id="ord"></button>
  <button class="btn" id="oscale"></button>
  <button class="btn" id="ocross"></button>
  <button class="btn" id="ohud"></button>
  <div class="gap"></div>
  <button class="btn" id="od">Done</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* ---------- blocks (original procedural textures) ---------- */
const B=[
{n:'Grass Block',t:'#5da13a',s:'#7b5333',band:1},{n:'Dirt',t:'#7b5333',s:'#6e482c'},
{n:'Stone',t:'#8a8a8a',s:'#7c7c7c'},{n:'Cobblestone',t:'#7a7a7a',s:'#6a6a6a',k:.3},
{n:'Oak Planks',t:'#b8924f',s:'#a98343'},{n:'Log',t:'#8a6a3a',s:'#5b4326'},
{n:'Sand',t:'#dccf94',s:'#d2c386'},{n:'Glass',t:'#cfeaf2',s:'#b6dce8',k:.05},
{n:'Bricks',t:'#a5523e',s:'#964a38',k:.25},{n:'Leaves',t:'#3f7d2a',s:'#356e23',k:.3},
{n:'Gravel',t:'#868080',s:'#797373',k:.3},{n:'Wool',t:'#e8e8e8',s:'#d4d4d4',k:.06}];
function mk(b){
  const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.scale(.5,.5);
  const k=b.k||.15;
  const f=(p,col,sh)=>{x.save();x.beginPath();p.forEach((q,i)=>x[i?'lineTo':'moveTo'](q[0],q[1]));x.closePath();x.clip();
    x.fillStyle=col;x.fillRect(0,0,32,32);
    for(let i=0;i<70;i++){x.fillStyle=rnd()<.5?`rgba(0,0,0,${k})`:`rgba(255,255,255,${k*.7})`;x.fillRect(rnd()*32|0,rnd()*32|0,2,2)}
    x.fillStyle=`rgba(0,0,0,${sh})`;x.fillRect(0,0,32,32);x.restore()};
  const T=[[16,1],[31,8],[16,15],[1,8]],L=[[1,8],[16,15],[16,31],[1,24]],R=[[16,15],[31,8],[31,24],[16,31]];
  f(T,b.t,0);f(L,b.s,.16);f(R,b.s,.34);
  if(b.band){f([[1,8],[16,15],[16,20],[1,13]],b.t,.16);f([[16,15],[31,8],[31,13],[16,20]],b.t,.34)}
  x.strokeStyle='rgba(0,0,0,.55)';x.lineWidth=1;x.beginPath();[[16,1],[31,8],[31,24],[16,31],[1,24],[1,8]].forEach((q,i)=>x[i?'lineTo':'moveTo'](q[0],q[1]));x.closePath();x.stroke();
  return c.toDataURL();
}
B.forEach(b=>b.url=mk(b));

/* ---------- sprites ---------- */
function sprite(m,pal){const c=document.createElement('canvas');c.width=9;c.height=9;const x=c.getContext('2d');
  m.forEach((r,j)=>[...r].forEach((ch,i)=>{if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1)}}));c.className='sp';return c}
const HM=['.........','.XXX.XXX.','XWXXXXXXX','XXXXXXXXX','XXXXXXXXX','.XXXXXXX.','..XXXXX..','...XXX...','....X....'];
const FM=['...XXXX..','..XXWXXX.','..XXXXXX.','..XXXXXX.','...XXXX..','..BB.....','.BB......','BB.......','.........'];
for(let i=0;i<10;i++){$('#hearts').append(sprite(HM,{X:'#d81e1e',W:'#ff9a9a'}));$('#food').append(sprite(FM,{X:'#c8743a',W:'#e8a468',B:'#eadfbc'}))}

/* ---------- hotbar / inventory ---------- */
let hot=[0,1,2,3,4,5,6,7,8],sel=0,cur='title',prev='title',tt;
function slots(el,arr,click){el.innerHTML='';arr.forEach((v,i)=>{const d=document.createElement('div');d.className='slot'+(click.sel&&i===sel?' sel':'');
  if(v>=0){d.innerHTML=`<img src="${B[v].url}" alt="${B[v].n}"><b>64</b>`}d.onclick=()=>click(i);el.append(d)})}
function draw(){
  const h=i=>{sel=i;draw();name()};
  h.sel=1;slots($('#hot'),hot,h);
  const h2=i=>{sel=i;draw()};h2.sel=1;slots($('#ih'),hot,h2);
  const inv=[...Array(27).keys()].map(i=>i<B.length?i:-1);
  const p=i=>{if(i<B.length){hot[sel]=i;draw();name()}};p.sel=0;slots($('#ig'),inv,p);
}
function name(){const t=$('#toast');const v=hot[sel];t.textContent=v>=0?B[v].n:'';t.style.transition='none';t.style.opacity=1;
  clearTimeout(tt);tt=setTimeout(()=>{t.style.transition='opacity .6s';t.style.opacity=0},1600)}

/* ---------- screens ---------- */
function go(s){prev=cur;cur=s;['title','game','inv','pause','opts'].forEach(i=>$('#'+i).classList.toggle('on',i===s));
  $('#scene').style.display=s==='title'?'none':'block';if(s==='game')name()}
$('#sp').onclick=()=>go('game');$('#bk').onclick=()=>go('game');$('#st').onclick=()=>go('title');
$('#o1').onclick=()=>go('opts');$('#o2').onclick=()=>go('opts');
$('#od').onclick=()=>go(prev==='opts'?'title':prev);
$('#q').onclick=()=>{$('#q').textContent='Close the tab :)'};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){go(cur==='game'?'pause':cur==='inv'||cur==='pause'?'game':cur==='opts'?(prev==='opts'?'title':prev):cur)}
  else if(e.key.toLowerCase()==='e'){if(cur==='game')go('inv');else if(cur==='inv')go('game')}
  else if(/^[1-9]$/.test(e.key)&&(cur==='game'||cur==='inv')){sel=e.key-1;draw();name()}});
addEventListener('wheel',e=>{if(cur==='game'){sel=(sel+(e.deltaY>0?1:8))%9;draw();name()}},{passive:true});

/* ---------- options ---------- */
let so=0,xh=1,hud=1;
function opt(){$('#oscale').textContent='GUI Scale: '+(so?so:'Auto');$('#ocross').textContent='Crosshair: '+(xh?'ON':'OFF');$('#ohud').textContent='Status Bars: '+(hud?'ON':'OFF');
  $('#cross').style.display=xh?'':'none';$('.bars').style.visibility=hud?'':'hidden';scale()}
$('#oscale').onclick=()=>{so=(so+1)%5;opt()};$('#ocross').onclick=()=>{xh^=1;opt()};$('#ohud').onclick=()=>{hud^=1;opt()};

/* ---------- title dirt background ---------- */
(function(){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.fillStyle='#6b4a2e';x.fillRect(0,0,16,16);
  for(let i=0;i<90;i++){const v=rnd();x.fillStyle=v<.5?'rgba(0,0,0,.22)':'rgba(255,255,255,.1)';x.fillRect(rnd()*16|0,rnd()*16|0,1+(rnd()*2|0),1)}
  $('#title').style.backgroundImage=`linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url(${c.toDataURL()})`})();

/* ---------- landscape behind game ---------- */
function scene(){
  const u=+getComputedStyle(document.documentElement).getPropertyValue('--u')||3,ps=Math.max(2,u*1.5|0);
  const cv=$('#scene'),W=Math.ceil(innerWidth/ps),H=Math.ceil(innerHeight/ps);cv.width=W;cv.height=H;const x=cv.getContext('2d');seed=11;
  const g=x.createLinearGradient(0,0,0,H*.7);g.addColorStop(0,'#6fa8ee');g.addColorStop(1,'#bcd9f7');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#fff7c2';x.fillRect(W*.78|0,H*.12|0,10,10);
  x.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<5;i++){const cx=rnd()*W,cy=H*.08+rnd()*H*.25;for(let j=0;j<3;j++)x.fillRect(cx+j*5,cy+(j%2)*-2,12,4)}
  const ph=rnd()*6;const hh=i=>(H*.62+Math.sin(i*.045+ph)*H*.05+Math.sin(i*.13+ph*2)*H*.015)|0;
  for(let i=0;i<W;i++){const h=hh(i);
    for(let y=h;y<H;y++){const d=y-h;x.fillStyle=d===0?'#5da13a':d<5?'#7b5333':'#7d7d7d';x.fillRect(i,y,1,1);
      if(rnd()<.2){x.fillStyle=`rgba(0,0,0,${.08+rnd()*.1})`;x.fillRect(i,y,1,1)}}}
  for(let i=8;i<W-8;i+=14+(rnd()*18|0)){const h=hh(i);x.fillStyle='#6a4a28';x.fillRect(i,h-9,2,9);x.fillStyle='#3f7d2a';x.fillRect(i-4,h-15,10,6);x.fillStyle='#4a8f33';x.fillRect(i-2,h-18,6,3)}
}

/* ---------- real 3D voxel world (replaces the flat landscape) ---------- */
let R,S,Cam;
function scene(){
  if(typeof THREE==='undefined')return;
  const u=+getComputedStyle(document.documentElement).getPropertyValue('--u')||3,ps=Math.max(2,u*1.5|0);
  if(!R){
    seed=11;R=new THREE.WebGLRenderer({canvas:$('#scene'),antialias:false});S=new THREE.Scene();
    S.background=new THREE.Color('#9cc8f5');S.fog=new THREE.Fog('#9cc8f5',18,46);
    Cam=new THREE.PerspectiveCamera(70,1,.1,100);
